<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070C" />
    <script>
      /* Resolve the theme before the stylesheet paints. Running this from the
         module bundle instead would let one frame of the wrong theme through,
         which reads as the application loading twice. */
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('intelora.theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (error) {
          /* Blocked storage — fall back to dark. */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#FFFFFF' : '#05070C');
      })();
    </script>
    <meta
      name="description"
      content="INTELORA — Enterprise AIoT Intelligence Platform. Fleet telemetry, anomaly detection, predictive maintenance, APM and OEE for MIKOS Smart Energy Sensors."
    />
    <title>INTELORA · Enterprise AIoT Intelligence</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F1A'/%3E%3Cpath d='M9 22V10h2.4v12H9Zm5-12h2.3l4.4 7.3V10H23v12h-2.3l-4.4-7.3V22H14V10Z' fill='%233D8EF0'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
